[package]
name = "ct-av1-fgs-engine"
version = "2.3.0"
edition = "2021"
authors = ["Anything2134"]
description = "CT-AV1-FGS-ENGINE: Modular Rust AV1 Film Grain Synthesis, Motion-Compensated Denoiser, and SVT-AV1 Event Engine"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
